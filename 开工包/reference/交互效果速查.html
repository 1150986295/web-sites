为拖动的替代。 ← → 5% 对象缩放与比例 Resize handle 调整对象尺寸时区分宽高独立变化和保持比例；控制柄位置与结果应一致。 16:9 锁定 折叠与恢复 Collapse pane 收起面板前保留可恢复尺寸，重新展开后按当前容器约束恢复，不直接回到无关的固定宽度。 320px 布局保存 Persisted layout 保存布局需要版本与设备适配策略；本地演示只保留当前会话，不能推断已经跨设备同步。 v2</p></div><div class=\"sec\"><h4>边界</h4><p>确认实现范围，检查异常、恢复和可访问性。 分隔条可拖动、方向键每次调 5%、Home／End 到边界；滑块可替代拖动。左右展开时各留至少约 80 px，收起前记住比例；尺寸仅保留在本次演练。</p></div><div class=\"sec\"><h4>完成后检查</h4><p>关键面板仍可用。 缩放和移动有明确控制柄。 浏览器调整窗口不是独立产品交互。 本篇调整工作区空间分配；响应式决定窗口约束，缩放与平移只改变内容的观看坐标。 元素位置 响应式 键盘操作</p></div>"}, {"cn": "画布绘制", "en": "Canvas Editing", "cat": "手势", "desc": "选择工具，完成一次编辑，撤销或继续。", "href": "https://www.vibehub.xin/item/ix_canvas_edit", "color": "#f08c00", "content": "<div class=\"sec\"><h4>概述</h4><p>了解适用场景，比较相近方案并明确选择条件。 工具状态 Drawing tool 绘制、选择和连线是不同模式；用户应随时知道当前工具，并能取消尚未完成的操作。 Esc 当前工具 · Esc 取消未完成操作 绘制与对象 Shape 绘制结果使用稳定标识，后续移动、选择和历史操作跟随对象身份，而非数组位置。 id 7 对象身份 · 不随数组位置改变</p></div><div class=\"sec\"><h4>演示</h4><p>完成一次本地演练，观察输入如何改变界面状态。 Esc 当前工具 · Esc 取消未完成操作 选择移动 Select and move id 7 对象身份 · 不随数组位置改变 自由绘制 Freehand draw 端点随对象重算 · 控制点单独编辑 连接图形 Connect nodes 对齐改几何 · 组合改操作单位 顶端对齐 Align top 撤销后新操作 → 清除重做分支 撤销重做 Undo and redo 添加图形 添加图形，或切换自由绘制 左移 20 右移 20 下移 20 等待操作 · 已选 0 项 · 可撤销 0 步 · 可重做 0 步 Shift + 点击多选；撤销后添加或移动图形将清除旧的重做分支。 选择移动 Select and move 选择图形后拖动，或使用移动按钮。</p></div><div class=\"sec\"><h4>流程</h4><p>沿操作顺序查看响应、分支和结果之间的关系。 框选与多选 Marquee 框选定义空间范围，多选定义选中集合；除持续拖动外，按场景提供点选范围或对象列表入口。 2 项 空间范围 → 选中集合 连线与控制点 Connection 连线应关联具体对象，移动对象后重新计算端点；控制点编辑与移动整个对象分别处理。 端点随对象重算 · 控制点单独编辑 对齐与组合 Align 对齐改变几何关系，组合改变选择和操作单位；操作前明确实际作用对象。 对齐改几何 · 组合改操作单位 命令历史 Command history 每个完成的编辑形成可撤销记录；撤销后执行新操作，应清除原来的重做分支。 撤销后新操作 → 清除重做分支</p></div><div class=\"sec\"><h4>边界</h4><p>确认实现范围，检查异常、恢复和可访问性。 编辑真实 SVG 对象和笔划，支持 Shift 多选、按钮移动／连接／顶端对齐及多步撤销重做。指针取消恢复拖动前快照；不含图层面板、文件导入、跨会话保存和完整专业编辑器工具。</p></div><div class=\"sec\"><h4>完成后检查</h4><p>工具状态可见。 坐标随缩放正确。 通用选择、缩放、撤销分别引用对应卡片。 本篇改变画布对象数据；缩放与平移只改变视图，确认与撤销提供通用恢复策略。 批量操作 画布缩放 误操作处理</p></div>"}, {"cn": "滚动控制", "en": "Scrolling & Position", "cat": "滚动", "desc": "滚动内层，到达边界，传递外层或定 用边界</dt><dd>适合封面与短展示区的探索式效果；正文阅读区、表单与表格不应被字符遮挡。 页面纹理：内容先绘制到离屏 2D 画布，再上传为纹理供着色器采样。字体、图片和动态内容变化后需要重新捕获，捕获频率直接决定开销。 尺寸与像素密度：按容器尺寸与设备像素比计算纹理，指针坐标要从页面位置换算到纹理 UV。密度提高清晰度的同时平方提高绘制成本。 上下文与资源：一套着色器、缓冲与纹理占用一个上下文；创建失败或被系统回收时必须退回静态画面，同页多个特效应限制同时运行数量。 帧循环与可见范围：只在特效可见时逐帧计算，标签页隐藏、滚出视区或用户停止后立即暂停，避免后台持续绘制。 性能预算：全屏片元着色、多层噪声与粒子最容易掉帧。先降分辨率、减少噪声层与粒子数量，再考虑关闭整个效果。</dd></div><div class=\"pt\"><dt>输入替代</dt><dd>指针驱动的效果需要等价入口：触屏用点按或拖拽切换，键盘提供启动、停止与参数按钮。 减少动态与静态降级：系统减少动态时不自动挂载演示，显示静态封面并保留原始内容；用户仍可手动启动。 语义与读屏：变形层是装饰，画布标记为隐藏；正文、链接与焦点顺序留在可访问的 DOM 中，不从纹理读取内容。</dd></div><div class=\"pt\"><dt>验收</dt><dd>关闭动效或减少动态时显示静态封面，正文与操作仍完整可用。；内容更新、字体加载与窗口缩放后纹理重新捕获，不残留旧画面或错位。；滚出视区、隐藏标签页或停止演示后停止逐帧绘制，回到画面时按当前状态恢复。；触屏与键盘都有等价入口，完整演示链接能在新标签页打开并单独调参。 页面纹理捕获与采样密度按设备调整，不支持 WebGL2 或减少动态时改用静态封面。 相关速查： 流动渐变 层次与质感 图片 响应式</dd></div></dl>"}, {"cn": "键盘操作", "en": "Keyboard Controls", "cat": "操作流程", "desc": "进入操作组，移动焦点，激活与离开。", "href": "https://www.vibehub.xin/item/ix_keyboard", "color": "#0c8599", "content": "<div class=\"sec\"><h4>概述</h4><p>了解适用场景，比较相近方案并明确选择条件。 顺序导航 Tab Tab 按文档中的合理顺序进入操作区域，Shift+Tab 反向离开；不要用正数 tabindex 人为拼出另一套顺序。 Tab Shift+Tab 控件内导航 Arrow keys 一组关联选项可以用方向键移动，组内只保留一个 Tab 入口；离开后应能回到当前选择或上次焦点。 1 Tab</p></div><div class=\"sec\"><h4>流程</h4><p>沿操作顺序查看响应、分支和结果之间的关系。 激活与取消 Enter 按钮的 Enter 与 Space 激活交给原生语义；Esc 取消当前层任务，不能顺带执行关闭后的破坏性操作。 确定 Esc Enter 快捷键范围 Shortcut scope 局部快捷键仅在相关区域生效；输入框和中文组词期间保留正常输入，不把字符误当作命令。 K scoped input 组合键与冲突 Modifier key 快捷键可能与浏览器、系统和辅助技术冲突，应可发现且有普通按钮替代；按产品平台核对组合键。 ⌘ K ! 首尾与翻页 Home 首尾和翻页作用于当前列表、编辑区或滚动容器，不能在用户输入文字时意外移动整页。 Home End</p></div><div class=\"sec\"><h4>边界</h4><p>确认实现范围，检查异常、恢复和可访问性。 方向键只在演练工具栏内移动焦点，R 只在非输入控件中返回首项；不会注册全站快捷键。Enter／Space 使用原生按钮激活，不改变输入法组词行为。</p></div><div class=\"sec\"><h4>完成后检查</h4><p>输入和中文组词不被全局快捷键拦截。 关键任务有可发现的普通入口。 首尾和翻页作用于当前列表、编辑区或滚动容器，不能在用户输入文字时意外移动整页。 本篇规定按键如何触发操作；焦点与操作范围决定焦点留在哪里，组件说明各自的键盘模型。 焦点管理 命令面板 可访问性</p></div>"}, {"cn": "焦点管理", "en": "Focus Management", "cat": "操作流程", "desc": "打开任务，焦点进入，关闭后返回。", "href": "https://www.vibehub.xin/item/ix_focus", "color": "#0c8599", "content": "<div class=\"sec\"><h4>概述</h4><p>了解适用场景，比较相近方案并明确选择条件。 焦点与选中 Focus 焦点指当前接收键盘输入的目标，选中指业务选择；两者可以不同，应各自有清楚的视觉表现。 focus selected 进入与返回 Initial focus 打开任务面板时把焦点送到合适入口，关闭后回到原触发点；原入口消失时选择相邻有效操作。 return trigger</p></div><div class=\"sec\"><h4>流程</h4><p>沿操作顺序查看响应、分支和结果之间的关系。 模态操作范围 Modal 模态任务期间限制背景交互；非模态区域允许继续访问外部内容，不能为所有浮层都建立焦点陷阱。 inert behind 隐藏与不可操作 Hidden 隐藏内容应退出焦点顺序；禁用表达不可执行，只读表达不可修改，三者不能只靠降低透明度代替。 hidden disabled readonly 对象移除后的焦点 Focus fallback 删除当前行、关闭标签或替换内容后，焦点应落到恢复入口、相邻项或区域标题，而不是丢到页面起点。 next 可见的焦点 Focus visible 键盘焦点需要可见且不被固定栏、浮层或裁切遮挡；滚动定位应为焦点目标留出空间。 sticky offset</p></div><div class=\"sec\"><h4>边界</h4><p>确认实现范围，检查异常、恢复和可访问性。 任务面板使用原生 dialog 的模态范围，打开后聚焦安全关闭按钮；隐藏操作区后聚焦恢复入口。演练不模拟读屏器，生产仍需验证朗读顺序和完整页面任务。</p></div><div class=\"sec\"><h4>完成后检查</h4><p>键盘不会进入隐藏面或丢到页面顶部。 非模态面板不无故限制焦点。 键盘焦点需要可见且不被固定栏、浮层或裁切遮挡；滚动定位应为焦点目标留出空间。 本篇管理操作位置与范围；浮层负责层级和关闭策略，键盘负责按键映射。 对话框 浮层操作 可访问性</p></div>"}, {"cn": "批量操作", "en": "Bulk Actions", "cat": "操作流程", "desc": "确定范围，选中对象，批量执行。", "href": "https://www.vibehub.xin/item/ix_selection", "color": "#0c8599", "content": "<div class=\"sec\"><h4>概述</h4><p>了解适用场景，比较相近方案并明确选择条件。 选择范围 Selection scope 全选前明确是当前页、当前查询结果还是全部数据；跨页选择不能只靠一个勾选图标暗示。 当前页 3 全部结果 8 单选与多选 Single selection 单选表达一个当前值，多选表达一个集合；选择与激活、导航是不同动作，不能互相冒充。 one · many</p></div><div class=\"sec\"><h4>流程</h4><p>沿操作顺序查看响应、分支和结果之间的关系。 部分选中 Indeterminate 集合只选中一部分时，用混合状态表达；点击全选后按约定选满或清空，并同步数量。 5/8 连续选择 Range selection 以稳定锚点选择连续范围；排序或筛选后应按当前可见顺序计算，不使用已经失效的行索引。 Shift 批量操作 Bulk action 操作前展示实际选中的对象与数量，处理中保持目标快照，条件变化时重新核对影响范围。 已选 3 项 删除 选择保留与清除 Stable identity 通过稳定对象标识保留选择，删除或筛选后不能把选择错套到另一项；提供明确的清除入口。 #A3 #A3</p></div><div class=\"sec\"><h4>边界</h4><p>确认实现范围，检查异常、恢复和可访问性。 固定 8 条本地记录，每页 3 条；支持当前页与全部匹配结果两种范围。筛选改变时清空旧选择，归档改变真实列表，恢复按钮重新载入本地样例；未连接批量接口。</p></div><div class=\"sec\"><h4>完成后检查</h4><p>明确区分当前页、当前结果与全部数据。 条件改变后重新核对作用对象。 通过稳定对象标识保留选择，删除或筛选后不能把选择错套到另一项；提供明确的清除入口。 本篇维护稳定对象与选择范围；排序改变顺序，筛选改变匹配集合，确认与撤销处理批量结果的恢复。 复选框 表格 误操作处理</p></div>"}, {"cn": "内容切换", "en": "Content Switching", "cat": "操作流程", "desc": "选择入口，展示内容，保留或重置。", "href": "https://www.vibehub.xin/item/ix_disclosure", "color": "#0c8599", "content": "<div class=\"sec\"><h4>概述</h4><p>了解适用场景，比较相近方案并明确选择条件。 展开与收起 Disclosure 触发入口表明当前是否展开，并与受控内容关联；收起后内容退出交互顺序。 aria-expanded 切换关联视图 Tabs 切换一组同级内容时，让当前选项与可见面板对应；导航到新页面应归页面跳转与返回。 概览 规格 评论</p></div><div class=\"sec\"><h4>流程</h4><p>沿操作顺序查看响应、分支和结果之间的关系。 互斥与独立展开 Accordion 互斥展开保持一次只查看一个区域，独立展开允许对照；策略应根据任务决定而非组件外观决定。 保留与重置 Preserve state 离开面板后可保留草稿或在重新进入时重置；在操作前说明策略，避免用户输入无声丢失。 draft reset 按需加载 Lazy content 首次展开才加载时，等待与失败属于该区域；加载失败应允许重试，不能让展开按钮没有响应。 retry 显隐与动效 Visibility 进入和退出的视觉变化跟随真实显隐状态；关闭动画后仍需正确切换可见内容与焦点。 reduced height</p></div><div class=\"sec\"><h4>边界</h4><p>确认实现范围，检查异常、恢复和可访问性。 详情使用原生 details，可切换独立／互斥展开；标签使用方向键和明确的草稿保留策略。示例不实现远程按需加载，异步面板仍需独立管理等待和失败。</p></div><div class=\"sec\"><h4>完成后检查</h4><p>焦点与选中面板一致。 内容隐藏后不继续接收输入。 进入和退出的视觉变化跟随真实显隐状态；关闭动画后仍需正确切换可见内容与焦点。 本篇决定内容何时显示及切换后的状态；动画的进出场说明显隐变化如何呈现。 标签页 折叠面板 焦点管理</p></div>"}, {"cn": "浮层操作", "en": "Overlay Controls", "cat": "操作流程", "desc": "打开父层，进入子层，逐层关闭。", "href": "https://www.vibehub.xin/item/ix_overlay", "color": "#0c8599", "content": "<div class=\"sec\"><h4>概述</h4><p>了解适用场景，比较相近方案并明确选择条件。 模态与非模态 Modal 模态用于需要暂时聚焦的任务，非模态保留外部操作；先决定操作范围，再选择弹窗、抽屉或气泡呈现。 modal menu 关闭契约 Dismiss 明确关闭按钮、Esc、点击外部各自是否关闭；关闭和确认提交是两个不同动作。 Esc</p></div><div class=\"sec\"><h4>流程</h4><p>沿操作顺序查看响应、分支和结果之间的关系。 嵌套层级 Overlay stack 多个浮层嵌套时，一次只关闭当前最上层；子层退出后回到父层触发位置。 Esc topmost 背景滚动锁定 Scroll lock 只有需要时锁定背景滚动，并在所有退出路径解除；关闭后应保留原阅读位置与已有样式。 restore 触发入口生命周期 Trigger 浮层依赖的对象可能被移除或导航离开；关闭后选择有效的焦点去向，并清理未完成监听。 opener 内容保护 Dismiss guard 关闭带草稿的浮层前先检查未保存内容；继续编辑、放弃和保存后退出分别说明结果。 编辑 放弃 保存</p></div><div class=\"sec\"><h4>边界</h4><p>确认实现范围，检查异常、恢复和可访问性。 父子两层使用原生模态 dialog；Esc 仅关闭最上层，关闭后由浏览器恢复父层触发入口，父层关闭回到原按钮。非模态菜单、悬浮提示的各自规则请看关联组件。</p></div><div class=\"sec\"><h4>完成后检查</h4><p>一次关闭当前层。 恢复之前的页面滚动与焦点。 未保存内容交给编辑与保存处理。 本篇负责打开、叠层、关闭与回到来源；焦点管理和进出场动效分别补充操作位置与视觉变化。 对话框 抽屉 气泡卡片 焦点管理</p></div>"}, {"cn": "页面导航", "en": "Page Navigation", "cat": "操作流程", "desc": "请求进入，确认退出条件，到达目标并恢复焦点。", "href": "https://www.vibehub.xin/item/ix_navigation", "color": "#0c8599", "content": "<div class=\"sec\"><h4>概述</h4><p>了解适用场景，比较相近方案并明确选择条件。 页面层级与方向 Navigation hierarchy 同级切换、进入子页面和返回上层表达不同关系，进入与退出方向应与历史和层级保持一致。 back 链接与新标签页 Link 链接应保留真实地址、复制与新标签页能力；打开新标签页不能同时替换来源页面。 new tab</p></div><div class=\"sec\"><h4>流程</h4><p>沿操作顺序查看响应、分支和结果之间的关系。 进入与退出 Enter 先明确目标页和退出条件，再衔接前后画面；动效结束不等于导航成功，失败时应保留可用来源。 route 等待、失败与取消 Navigation pending 目标加载期间可以取消或改变目标；旧导航晚到后不能覆盖新意图，失败应保留重试和返回入口。 retry cancel 未保存拦截 Leave guard 离开编辑页时先说明草稿状态，允许继续编辑或明确放弃；取消离开不能改变当前草稿。 编辑 放弃 保存 历史与状态恢复 History 返回应恢复来源查询、选择与阅读位置；直接打开和刷新深链接也应能确定目标内容，不能依赖一次点击留下的内存。 position</p></div><div class=\"sec\"><h4>边界</h4><p>确认实现范围，检查异常、恢复和可访问性。 下方历史栈、加载回传和离开拦截均为本地页面流；支持父子／同级跳转、前进返回、旧回传失效与查询／滚动／焦点恢复。新标签链接另开页面并保留原详情。刷新演练会重置历史；深链接持久化需路由层实现。</p></div><div class=\"sec\"><h4>完成后检查</h4><p>进入与返回方向符合层级。 取消离开不丢草稿。 导航失败有可用去向。 本篇决定是否离开、到达哪里以及返回恢复什么；进出场与视图转场分别说明进入、退出和共享对象的视觉衔接。 链接 导航菜单 内容编辑</p></div>"}, {"cn": "内容搜索", "en": "Content Search", "cat": "操作流程", "desc": "用关键词与条件找到内容，区分无匹配和查询失败。", "href": "https://www.vibehub.xin/item/search", "color": "#0c8599", "content": "<div class=\"sec\"><h4>概述</h4><p>了解适用场景，比较相近方案并明确选择条件。 关键词搜索 Search 在约定字段中查找文字。本页只检索项目名称，命中文字高亮；不检索类别或状态，也不进行语义推断。 晨雾 晨雾海报 夜航手册 条件筛选 Filter 按类别、状态、日期或数值范围保留符合条件的项目，适合表达关键词难以准确描述的结构化条件。 类别 状态 日期 即时搜索 Live search 输入变化即可更新结果，适合成本较低的本地查询；中文输入法组词期间先保留草稿，确认输入后再查询。 晨 live 提交查询 Submit search 输入只是草稿，按 Enter 或点击搜索后才应用。结果说明对应的已提交关键词，避免草稿与结果混淆。 晨雾 Enter draft 搜索建议 Query suggestions 根据部分输入给出可用查询词，选择后补全查询；建议列表与最终结果不同。支持方向键选择、Enter 应用与 Esc 收起。 晨 晨雾海报 晨间配色 最近搜索与热门搜索 Recent searches 最近搜索来自个人历史，热门搜索来自汇总趋势，通常在输入为空时出现。应标明来源，历史记录提供删除或清空入口。 晨雾 配色 包含匹配 Contains 名称中包含完整关键词即可命中。例如「晨雾」可找到「晨雾海报」，演示会去掉查询首尾空白。 晨雾海报 海报设计 精确匹配 Exact match 本页演示要求名称与关键词完全一致；全文检索中的短语匹配通常只要求词序相邻，两者规则需要分别说明。 = 晨雾 晨雾 晨雾海报 前缀匹配 Prefix match 只匹配从字段或词语开头开始的输入，常用于搜索建议；与在任意位置查找的包含匹配区分。 晨 晨雾海报 今晨 模糊匹配与纠错 Fuzzy search 允许一定拼写差异，或提出可能正确的查询词，需要可控阈值和评分。包含匹配不等于模糊搜索，本地演示不做纠错。 辰雾 晨雾 层雾 同义词与语义搜索 Synonyms 同义词扩展查询表达，语义搜索按含义召回，全文检索通常基于分词与索引查文档。这些机制各有边界，本页固定名称数据不模拟它们。 电影 影片 放映 命中高亮 Match highlighting 在结果中标出实际命中文字，帮助理解为什么命中。高亮只增强阅读，不应改变原文字或用未经转义的 HTML 拼接结果。 晨雾海报 夜航手册 match</p></div><div class=\"sec\"><h4>流程</h4><p>沿操作顺序查看响应、分支和结果之间的关系。 分面筛选 Faceted search 将类型、状态等维度拆成可组合条件。演示的类型候选数保留关键词与发布状态，但忽略当前类型选择，表示切到该类型能找到多少项。 更多 12 单选与多选 Single-select filter 单选在同一维度保留一个值，多选保留多个值。演示中发布状态单选，项目类型多选；未选任何类型表示不限类型。 filters 交集与并集 AND 本页同一类型内按 OR 取并集，类型与状态、关键词之间按 AND 取交集。例如（设计或代码）且已发布。 A B A ∩ B 范围筛选 Range filter 用最小值、最大值或日期区间约束范围，说明边界是否包含。修改范围后通常回到结果第一页；本页不演示范围控件。 min max 0 ≤ x ≤ 100 已应用条件 Applied filters 用可移除标签展示真正作用于结果的条件，逐个移除时保留其余条件。输入草稿不应提前显示成已应用关键词。 设计 已发布 近 7 天 清除与重置 Clear query 清除关键词只移除文字；清空条件移除全部筛选并恢复完整列表。本页「重置演示」恢复当前术语的初始样例，含义与清空不同。 晨雾 reset 即时与确认筛选 Instant filtering 即时筛选在条件变化时更新，确认筛选先编辑草稿再点击应用。后者适合多条件、移动面板或昂贵查询，要区分待应用值与生效值。 即时 应用 结果排序 Sort order 排序改变顺序，不改变匹配集合。演示可比较更新时间降序与名称升序；相关性排序需要服务定义评分，不把更新时间当成相关性。 更新 desc 结果数量 Result count 数量与当前已完成查询一致，远程分页区分总匹配数与已加载条数。失败时数量未知，不能报告为零匹配。 24 条结果 12/24 无结果与失败 No results 无结果表示查询成功但没有匹配项，提供换词或放宽条件；失败表示没有完成查询，保留条件并提供重试。 换词 重试 查询中与旧结果 Pending 等待期间可保留上次结果，但必须标明其对应旧查询，不能将旧数量当成新结果数量。演示通过手动回传成功结束等待。 old → loaded 关键词输入 Query 保留明确标签，输入后仍能理解字段用途。 关键词 输入名称 条件筛选 Filters 补充关键词难以表达的类别、状态与范围。 类别：设计 状态：已发布 applied 结果反馈 Results 说明结果数量，无结果时提供换词或清空入口。 18 条结果 empty → retry 清空入口 Clear 清空关键词和条件，保留输入焦点。 晨雾</p></div><div class=\"sec\"><h4>边界</h4><p>确认实现范围，检查异常、恢复和可访问性。 防抖查询 Debounce 连续输入时重置等待，最后一次输入停顿后才应用。演示等待 500 ms，Enter 可立即提交；实际时长按延迟和查询成本确定。 500ms 节流 Throttle 在一段时间内限制执行频率，持续输入时仍可能周期执行；防抖则等输入停顿。客户端节流不等同于服务端限流。 tick rate limited 输入法组合 IME 中文等输入法组词时只更新草稿，compositionend 后再查询。组词期间的 Enter 用于确认候选字，不能误触提交。 chen 晨 沉 查询竞态 Latest query wins 新查询使旧请求失效，可配合取消与请求序号检查。只允许仍对应当前条件的响应更新结果，防抖本身不能防止乱序覆盖。 A B 查询状态同步 URL search params 关键词、筛选、排序和页码共同构成查询状态。按需同步到 URL、支持刷新与返回恢复；本页 URL 只记住所选术语，不保存输入或筛选值。 ?q=晨&amp;type=海报 back restores 筛选与分页 Pagination reset 查询条件变化后回到有效起点，避免沿用旧页码显示假空结果；游标、总数与下一页标识都要绑定同一查询。 1 2 3 结果通知 aria-live 结果数量通过状态区域温和通知，更新不抢走输入焦点。清空后回到输入框，加载中标记忙碌，失败提供可访问的重试入口。 18 条结果 aria-live 本地演示包含即时查询、建议补全、包含与精确匹配、 入</p></div><div class=\"sec\"><h4>边界</h4><p>Paste 粘贴、自动填充、长文本、空白与特殊字符都是正常输入路径；字符限制按产品规则说明。 粘贴的长文本… paste 2 / 140</p></div><div class=\"sec\"><h4>边界</h4><p>确认实现范围，检查异常、恢复和可访问性。 名称使用原生输入与输入法组合事件；至少两个非空白字符，可切换失焦／提交校验及只读。提交只确认本地文本，不替代服务端校验；本例不演示复杂格式化或远程唯一性检查。</p></div><div class=\"sec\"><h4>完成后检查</h4><p>组词和光标位置不被破坏。 格式化不丢原始信息。 错误不只靠颜色表达。 本篇处理字段值与校验时机；表单组织多字段依赖，编辑与保存管理草稿和已确认内容。 输入框 表单 分步表单</p></div>"}, {"cn": "分步表单", "en": "Multi-step Forms", "cat": "操作流程", "desc": "填写当前步骤，检查依赖，复核并提交。", "href": "https://www.vibehub.xin/item/ix_form_flow", "color": "#0c8599", "content": "<div class=\"sec\"><h4>概述</h4><p>了解适用场景，比较相近方案并明确选择条件。 步骤与任务 Multi-step form 按任务依赖拆分步骤，让用户知道当前位置与剩余内容；步骤条的外观不决定业务是否允许跳步。 2 第 2 / 3 步 字段依赖 Conditional field 上游选择改变后，下游字段可能不再适用；及时清理失效值，并保留仍然有效的输入。 团队 个人 团队名称</p></div><div class=\"sec\"><h4>流程</h4><p>沿操作顺序查看响应、分支和结果之间的关系。 跨字段校验 Cross-field validation 校验字段之间的关系，在字段附近说明原因；提交失败时帮助用户定位到第一处需要修正的位置。 两次输入不一致 前进与返回 Step navigation 前进检查当前步骤条件，返回保留输入；在最终提交前提供复核与局部返回修改。 1 2 输入保留 提交与复核 Review 展示即将提交的关键内容，提交期间限制重复任务；真实成功由确认结果决定。 提交 离开与恢复 Resume 跨页或刷新后的恢复需要明确持久化策略；本地内存演示不能代表已经保存到账号。 草稿 仅内存</p></div><div class=\"sec\"><h4>边界</h4><p>确认实现范围，检查异常、恢复和可访问性。 三步表单可返回修改且保留输入，团队名称仅在团队类型下要求和提交；最终结果只在页面展示。没有提交到后端，刷新和实际路由离开不会保留此演练。</p></div><div class=\"sec\"><h4>完成后检查</h4><p>返回保留有效输入。 错误定位到具体字段。 分步、登录和业务审批分别建立关联。 本篇组织字段之间的依赖和分步推进；单字段校验、草稿保存和身份验证分别关联到对应流程。 表单 步骤条 输入校验 任务处理</p></div>"}, {"cn": "内容编辑", "en": "Content Editing", "cat": "操作流程", "desc": "分清草稿与已保存内容，处理连续编辑、保存失败和离开保护。", "href": "https://www.vibehub.xin/item/ix_edit", "color": "#0c8599", "content": "<div class=\"sec\"><h4>概述</h4><p>了解适用场景，比较相近方案并明确选择条件。 就地编辑 Inline editing 在原信息位置进入编辑，减少上下文切换。提供明确的编辑、保存和取消入口，键盘也能完成同一任务。 标题 显式保存 Explicit save 用户点击保存才提交草稿，适合多字段、需要检查或有明显成本的修改。未变化时无需重复保存。 草稿 保存 自动保存 Autosave 输入短暂停顿后提交，适合持续编辑。说明未保存、保存中、已保存或失败，不能只让输入内容看起来已经保存。 已保存 debounce</p></div><div class=\"sec\"><h4>流程</h4><p>沿操作顺序查看响应、分支和结果之间的关系。 草稿与已确认值 Draft 草稿是当前输入，已确认值是最近一次成功保存的内容。两者不同表示有未保存修改，取消编辑回到已确认值。 草稿 已保存 取消回到已保存 保存快照 Save snapshot 提交时捕获草稿。处理中继续输入时，成功只确认所提交的快照，后续输入仍是未保存内容，不能被旧响应覆盖。 快照 未保存 校验与失败 Validation 校验失败在字段附近说明原因；请求失败保留草稿并允许重试。演示名称去掉首尾空白后不能为空。 名称不能为空 草稿保留 保存冲突 Conflict 多人或多端编辑时，服务端用版本检查防止覆盖他人修改；发生冲突要保留本地草稿，并让用户比较、合并或重新载入。 v1 v2 ! 连续编辑 Edit during save 提交一次修改，再继续输入，手动回传成功。已保存值只更新为第一次提交的内容，最新草稿仍保留。 提交 继续输入 防抖保存 Trailing debounce 自动保存等待输入停顿，中文输入法组词期间不提交。前次任务完成后，如果草稿又有变化，再安排下一次保存。 停顿 未保存保护 Unsaved changes 尝试结束编辑时先检查是否有草稿或进行中的任务。可以继续编辑或明确放弃；放弃同时使旧保存回传失效。 未保存 继续 放弃</p></div><div class=\"sec\"><h4>边界</h4><p>确认实现范围，检查异常、恢复和可访问性。 键盘约定 Enter 单行演示中 Enter 保存，Esc 请求取消，中文组词时不拦截 Enter。结束编辑后焦点回到编辑入口，多行输入应保留 Enter 换行。 Enter Esc 焦点 离开与持久化 beforeunload 浏览器离开提示存在触发和移动端限制，站内跳转另需路由保护；长文应按需要持久化草稿，不能只依赖离开提示。 beforeunload 草稿 验收空白名称、失败重试、保存中继续编辑、自动保存的输入法处理和放弃后的旧回传。本页只保护演示中的结束编辑，刷新或离开页面不保留草稿；冲突处理是生产边界说明，不是联网演示。</p></div><div class=\"sec\"><h4>完成后检查</h4><p>保存中继续编辑，旧快照不会覆盖新草稿。 失败和校验错误保留输入，允许修正与重试。 中文组词期间不自动提交，放弃后旧回传失效。 本篇管理草稿与保存生命周期；输入框、表格、表单与弹窗各自说明承载编辑的控件。 输入框 表单 表格 对话框 任务处理 误操作处理</p></div>"}, {"cn": "文件传输", "en": "File Transfer", "cat": "操作流程", "desc": "接收文件，逐项校验，传输或取消。", "href": "https://www.vibehub.xin/item/ix_files", "color": "#0c8599", "content": "<div class=\"sec\"><h4>概述</h4><p>了解适用场景，比较相近方案并明确选择条件。 文件选择与接收 File input 选择器、拖入和粘贴是接收文件的不同入口；文件类型和数量规则应在操作前可见。 paste Drop 文件校验 File type 在上传前检查允许类型、大小和数量，逐项说明拒绝原因；扩展名检查不能替代服务端内容验证。 3.2 MB PDF</p></div><div class=\"sec\"><h4>流程</h4><p>沿操作顺序查看响应、分支和结果之间的关系。 传输队列 Upload queue 批量文件各自有等待、传输、完成和失败状态；取消一项不应无故清空整个队列。 80% 进度与取消 Transfer progress 进度应来自已知传输量；本地演示按手动推进展示状态，不能把它描述为真实网络上传。 42% AbortController 重试与断点 Retry 失败后保留文件和失败原因；断点恢复还需要服务端会话与已确认分片，不能只从旧百分比继续播放。 offset 已确认 预览与下载 Object URL 浏览器可以为本地文件生成预览和下载地址；移除文件或退出时释放对象 URL，避免泄漏内存。 blob: revoke</p></div><div class=\"sec\"><h4>边界</h4><p>确认实现范围，检查异常、恢复和可访问性。 文本读取、图片预览和原文件下载真实运行，限每项 2 MiB，文本预览前 2 KiB。上传由手动分片进度模拟，不发送文件；取消后重试只续接本地计数，不表示服务端支持断点续传。</p></div><div class=\"sec\"><h4>完成后检查</h4><p>进度来自已知传输。 不伪造写入成功或断点续传。 浏览器不支持的能力有替代入口。 本篇处理文件对象与传输生命周期；通用请求竞态看异步任务，展示图片的尺寸与替代文本看图片基础。 上传 进度条 任务处理</p></div>"}, {"cn": "内容分享", "en": "Content Sharing", "cat": "操作流程", "desc": "准备内容，主动复制或分享，确认结果或手动替代。", "href": "https://www.vibehub.xin/item/ix_clipboard_share", "color": "#0c8599", "content": "<div class=\"sec\"><h4>概述</h4><p>了解适用场景，比较相近方案并明确选择条件。 复制与确认 Clipboard write 复制成功必须来自真实写入结果；写入被拒绝或不受支持时说明原因，并提供手动选择复制。 已复制 粘贴与剪切 Paste 保留用户熟悉的键盘剪贴板操作；接收富文本时按业务决定格式与清理策略，不直接插入不可信 HTML。 plain</p></div><div class=\"sec\"><h4>流程</h4><p>沿操作顺序查看响应、分支和结果之间的关系。 用户触发与权限 User activation 浏览器可能要求安全环境、用户操作或授权，读取剪贴板比写入有不同限制；不在页面加载时自动读取。 复制 allow? 可恢复的分享地址 Share URL 分享地址应能恢复必要的内容与条件；不要把隐私输入或仅存在内存中的临时标识当作可分享结果。 ?q=design 恢复内容与条件 系统分享与替代 Web Share 支持系统分享时由用户主动打开；不支持或用户取消时保留复制链接等可用入口。 copy link Web Share 失败后的下一步 Permission denied 复制或分享失败后不清空原内容，不反复弹授权；用户仍能选中文本或取得明确目的地。 未授权 手动选择复制</p></div><div class=\"sec\"><h4>边界</h4><p>确认实现范围，检查异常、恢复和可访问性。 复制、读取与系统分享调用真实浏览器 API，只在主动点击后执行；拒绝时保留可选文本。模拟拒绝选项跳过实际写入。系统分享返回只代表流程结束，无法确认对方收到内容。</p></div><div class=\"sec\"><h4>完成后检查</h4><p>不提前显示复制成功。 保留浏览器快捷键。 文件编码归文件与传输。 本篇处理内容离开当前界面的交付动作；导航负责打开目标页面，通知负责反馈结果。 链接 权限请求 文件传输</p></div>"}, {"cn": "身份验证", "en": "Authentication", "cat": "操作流程", "desc": "输入演示账号，核对测试码，返回原任务。", "href": "https://www.vibehub.xin/item/ix_auth", "color": "#0c8599", "content": "<div class=\"sec\"><h4>概述</h4><p>了解适用场景，比较相近方案并明确选择条件。 身份与会话 Authentication 身份验证确认当前用户，会话记录有效状态；界面显示已登录不等于服务端已经建立可信会话。 session 服务端确认 验证码与自动填充 One-time code 验证码支持粘贴与系统自动填充，错误保留可修正的输入；本地演示显示测试码，不接收真实凭证。 214905 autofill 可粘贴</p></div><div class=\"sec\"><h4>流程</h4><p>沿操作顺序查看响应、分支和结果之间的关系。 重发与等待 Resend 重发入口说明何时可再次请求，并保留原验证流程；演示间隔不是生产系统的安全限制。 5s 重发 过期与重新验证 Session expiry 会话过期时保留正在进行的任务上下文；重新验证后回到原任务，不静默丢弃草稿。 会话过期 重新验证 密码管理器与通行密钥 Password manager 使用适合密码管理器和平台验证的原生语义；真实通行密钥验证涉及服务端挑战，本地流程不冒充认证。 passkey WebAuthn 退出与权限</p></div><div class=\"sec\"><h4>边界</h4><p>Sign out 退出清理会话相关状态；身份验证和业务权限分别由可信系统核对，用户可编辑的内容不能自授权限。 role: user 不可自授权限</p></div><div class=\"sec\"><h4>边界</h4><p>确认实现范围，检查异常、恢复和可访问性。 固定测试码 214905、5 秒重发冷却与会话过期均为本地模型；不收集密码，不发送短信或邮件，也不连接真实账号。真实授权、限流与会话校验必须由服务端完成。</p></div><div class=\"sec\"><h4>完成后检查</h4><p>允许粘贴和密码管理器。 登录状态由可信结果确认。 本地演示不产生真实账号或凭证。 本篇处理身份和会话恢复；权限请求处理设备能力授权，不能用本地身份状态替代后端鉴权。 输入框 权限请求 内容编辑</p></div>"}, {"cn": "任务处理", "en": "Task Processing", "cat": "操作流程", "desc": "管理请求的等待、取消与结果，避免旧响应覆盖当前操作。", "href": "https://www.vibehub.xin/item/ix_async", "color": "#0c8599", "content": "<div class=\"sec\"><h4>概述</h4><p>了解适用场景，比较相近方案并明确选择条件。 请求状态 Request state 待命、处理中、成功、失败和已取消描述任务生命周期。悬停、聚焦和按下是输入状态，可以与任务状态同时存在。 Idle → Pending → Done / Error 等待确认 Pessimistic update 等任务成功后再更新数据，适合需要准确确认的保存、提交与重要操作。等待期间保留已显示内容。 保存 旧值保留 确认后才更新数据 乐观更新 Optimistic update 先呈现预计结果，再等待确认；失败时回滚并解释原因。适合可逆、风险较低的操作，回滚要对应本次修改。 12 13 先呈现预计结果，再等待确认 点击反馈只说明输入已被接收。成功消息应由确认结果触发，不能把按钮动效结束当成任务完成。</p></div><div class=\"sec\"><h4>流程</h4><p>沿操作顺序查看响应、分支和结果之间的关系。 防重复提交 Duplicate submission 处理中限制同一任务重复发起，保留取消等必要操作。客户端禁用按钮只是入口保护；生产写操作仍需服务端幂等与权限校验。 提交 single flight 处理中只允许一个请求 取消与超时 AbortController 取消表示用户放弃当前等待，超时表示未在约定时间得到结果，两者应分别反馈。中止客户端请求不保证服务器已撤销写入。 AbortController 取消由用户 · 超时由时限 最新结果优先 Latest request wins 每次输入生成新的请求标识。只有仍对应当前意图的响应可以更新结果；旧响应晚到时忽略，取消请求与标识检查可配合使用。 A #1 B #2 旧响应晚到 → 忽略 失败与重试 Retry 明确失败原因，保留输入和已有数据，重试使用新的请求。涉及写入且结果未知时先核对任务状态，避免盲目重复。 失败 重试 保留输入，用新请求重试 任务回传 Resolve 演示由你手动回传成功或失败，等待时长由操作决定。可以取消等待，再验证旧结果不会改变当前状态。 手动回传成功或失败 乱序响应 Out-of-order response 先发起 A，再发起 B，先回传 B 再回传 A，观察界面始终保留 B 的结果。 A B B 先回 → 只保留 B 乐观回滚 Optimistic rollback 收藏立即改变可见状态。手动回传失败后恢复之前的值，保留错误和再次尝试的入口。 13 12 失败 → 回滚到原值</p></div><div class=\"sec\"><h4>边界</h4><p>确认实现范围，检查异常、恢复和可访问性。 状态通知 role=status 等待和结果用文字表达，普通变化通过状态区域通知，失败提供清楚的恢复操作。状态变化不强制抢走焦点。 已保存 aria-live 焦点留在按钮 任务清理 Unmount 离开页面后释放监听和定时器，使未完成任务失效；晚到响应不能写回已卸载界面。 卸载后取消监听，丢弃晚到响应 验收连续提交、取消后返回、A/B 乱序、失败回滚和键盘操作；关闭动画后流程仍应完整。本地演示没有网络和服务端幂等保证。</p></div><div class=\"sec\"><h4>完成后检查</h4><p>处理中阻止同一任务重复提交，必要操作仍可使用。 取消和过时响应不会更新已确认值。 失败保留输入、解释原因，并提供重试。 本篇决定请求结果何时生效；加载指示器与操作反馈决定等待和结果怎样呈现。 按钮 表单 内容搜索 内容编辑</p></div>"}, {"cn": "误操作处理", "en": "Mistake Handling", "cat": "操作流程", "desc": "按风险选择事前确认或事后撤销，让误操作有可用的恢复入口。", "href": "https://www.vibehub.xin/item/ix_recovery", "color": "#0c8599", "content": "<div class=\"sec\"><h4>概述</h4><p>了解适用场景，比较相近方案并明确选择条件。 直接执行 Direct action 影响小且容易反向操作的行为可以直接执行，例如展开内容或切换显示。即时反馈应与实际结果一致。 可反向的小动作立即生效 事前确认 Confirmation 后果明显或难以恢复时，执行前说明对象、数量和影响。按钮写明确动作，例如“删除条目”，避免只有“确定”。 删除 3 个条目？ 取消 删除 事后撤销 Undo 可恢复的操作可以先执行，再提供撤销。恢复窗口、数据保留和服务端能力要真实成立，不能仅让提示文字变成“已撤销”。 已删除 撤销 先执行，再提供真实撤销</p></div><div class=\"sec\"><h4>流程</h4><p>沿操作顺序查看响应、分支和结果之间的关系。 明确影响范围 Scope 确认前展示操作对象和后果，批量操作说明实际选中范围。条件变化时重新核对目标，避免误删其他数据。 已选 3 项 · 批量前核对范围 取消与安全默认 Cancel 确认框提供易找到的取消，初始焦点优先给安全操作。Esc 表示取消，关闭确认不能触发破坏性操作。 取消 Esc Esc 取消 · 初始焦点在安全操作 撤销与重做 Undo 撤销恢复之前的数据，重做重新应用被撤销的修改。撤销后执行新的操作应清除旧重做分支；多步编辑需维护历史栈。 撤销后新操作清除重做 恢复失败 Recovery failure 恢复也可能失败，不能提前宣称已经恢复。保留错误、恢复目标和重试入口，必要时重新核对服务器上的数据。 撤销失败 重试 不能提前宣称已恢复 确认后删除 Confirm then delete 在原生模态对话框中取消或提交删除，再手动回传结果。请求失败时条目保留，成功后才允许撤销。 删除条目？ 删除 失败时条目保留 可撤销删除 Undoable delete 可逆方式先移除条目，保持持久的撤销入口。撤销会恢复真实列表，重做再次删除，按钮可用性随历史变化。 已删除 撤销 撤销恢复真实列表</p></div><div class=\"sec\"><h4>边界</h4><p>确认实现范围，检查异常、恢复和可访问性。 确认框焦点 Modal dialog 打开后焦点进入对话框，关闭后回到触发入口；原入口已消失时移到恢复入口或相邻的有效位置。 删除 取消 关闭后焦点回到触发处 恢复窗口 Undo window 如果撤销有时限，说明时限并给足操作时间。本地演示不设倒计时；生产系统需实现软删除或可验证的反向操作。 30s 时限内可撤销 · 生产需软删除 验收取消、Esc、删除失败、撤销、重做和焦点回归。本页只演示单条删除的一步历史，本地恢复立即完成；永久删除、服务端恢复失败与多步历史不能由演示能力推断。</p></div><div class=\"sec\"><h4>完成后检查</h4><p>确认文案说明具体对象，取消不执行操作。 失败保留原数据，恢复成功后才宣称已撤销。 删除后焦点移到有效操作，撤销恢复原位置。 本篇按风险选择确认或撤销；确认框负责询问，全局提示负责呈现反馈和恢复入口。 气泡确认框 对话框 全局提示 任务处理 内容编辑</p></div>"}, {"cn": "消息通知", "en": "Notifications", "cat": "操作流程", "desc": "收到消息，查看来源，标记已读或静音。", "href": "https://www.vibehub.xin/item/ix_notifications", "color": "#0c8599", "content": "<div class=\"sec\"><h4>概述</h4><p>了解适用场景，比较相近方案并明确选择条件。 反馈与通知 Feedback 反馈回应当前操作，通知带来其他时间或来源的消息；重要结果不能只靠一个会消失的提示表达。 已保存 3 操作反馈 · 他处通知 消息生命周期 Unread 已读、隐藏和删除表示不同含义；打开来源或标记已读后，应同步数量和列表状态。 未读 · 已读 · 已隐藏</p></div><div class=\"sec\"><h4>流程</h4><p>沿操作顺序查看响应、分支和结果之间的关系。 通知聚合 Coalescing 高频消息按对象或时间聚合，保留可追溯详情；不要让多个区域连续抢夺注意力。 4 同类消息合并为一条 可行动消息 Actionable message 需要后续操作的消息提供清楚入口，并带到对应对象；普通消息不强制切走当前任务。 查看 入口直达对应对象 读屏通知 role=status 常规状态用适当的状态区域表达；只有需要立即处理的重要信息才打断，避免重复播报整份列表。 连接中断 aria-live 常规不打断 · 重要才提醒 系统通知与静音 Notifications API 系统通知由用户主动选择并受浏览器权限控制；页面内静音偏好与操作失败提示分别处理。 系统通知 静音 权限由用户授予</p></div><div class=\"sec\"><h4>边界</h4><p>确认实现范围，检查异常、恢复和可访问性。 本地按钮生成固定来源的消息，支持分组、已读、来源跳转和静音；静音只隐藏即时提示，不丢收件箱数据。本例没有系统通知、推送服务或跨设备已读同步。</p></div><div class=\"sec\"><h4>完成后检查</h4><p>重要状态不只短暂闪现。 消息不抢焦点。 浏览器通知权限交权限请求解释。 本篇管理消息的可见性和去向；异步任务决定真实业务结果，系统通知授权属于权限请求。 通知提醒框 全局提示 权限请求</p></div>"}, {"cn": "失败重试", "en": "Failure Retry", "cat": "操作流程", "desc": "识别失败范围，保留成功结果，核对并只重试失败项。", "href": "https://www.vibehub.xin/item/ix_failure", "color": "#0c8599", "content": "<div class=\"sec\"><h4>概述</h4><p>了解适用场景，比较相近方案并明确选择条件。 失败范围 Field error 先说明失败发生在哪个对象或区域；局部问题不应把仍可使用的内容全部替换为空白。 局部失败不替换整页 保留上下文 Preserve context 失败后保留输入、已确认数据和当前位置，用户不必重新完成已经成功的步骤。 草稿 输入与已确认数据都保留</p></div><div class=\"sec\"><h4>流程</h4><p>沿操作顺序查看响应、分支和结果之间的关系。 重试范围 Retry failed items 只重试失败的目标；写操作需要确认已成功项目和服务端幂等，不能对整批数据盲目重放。 仅重试失败项 未知结果 Unknown outcome 断线不代表写入失败，结果未知时先核对任务状态，再决定重试或恢复。 ? 核对 断线 ≠ 写入失败 回滚与降级 Rollback 回滚应对应具体修改，降级保留核心任务；不能只把错误文字改成成功而不恢复数据。 核心 回滚对应修改 · 降级保留核心 可执行的错误 Actionable error 错误说明影响、可修正内容与下一步操作；不能只显示一个内部错误码或反复要求刷新。 重试 说明原因与下一步</p></div><div class=\"sec\"><h4>边界</h4><p>确认实现范围，检查异常、恢复和可访问性。 手动回传三个条目的本地结果，只重试失败项；未知项必须先核对为已完成或未执行，成功项提交次数保持不变。本例展示流程，未实现网络幂等键和实际补偿事务。</p></div><div class=\"sec\"><h4>完成后检查</h4><p>不重复执行已成功项目。 错误说明影响和下一步。 具体请求调度引用异步任务。 本篇从失败状态寻找下一步；异步任务管理单次请求时序，确认与撤销恢复已经完成的操作。 任务处理 误操作处理 结果</p></div>"}, {"cn": "操作引导", "en": "Guided Tasks", "cat": "操作流程", "desc": "发现入口，完成当前步骤，跳过或再次查看。", "href": "https://www.vibehub.xin/item/ix_guidance", "color": "#0c8599", "content": "<div class=\"sec\"><h4>概述</h4><p>了解适用场景，比较相近方案并明确选择条件。 上下文帮助 Contextual help 帮助围绕当前操作解释必要信息，默认不遮挡主要内容；复杂说明按需要展开。 ? 帮助靠近当前操作，默认不遮挡 任务引导 Walkthrough 引导说明任务顺序并指向真实可用控件；不能让演示中的下一步代替产品自身缺失的入口。 生成 指向真实可用控件</p></div><div class=\"sec\"><h4>流程</h4><p>沿操作顺序查看响应、分支和结果之间的关系。 跳过与继续 Skip 用户能跳过、退出并再次查看引导；跳过不影响正常使用，也不让功能永远不可发现。 跳过 继续 跳过不影响功能，可再次查看 当前步骤与高亮 Current step 一次突出当前操作目标，高亮跟随真实步骤变化；目标不存在时跳过或解释，不显示悬空提示。 2 一次只高亮当前目标 空状态行动 Empty state 尚未创建、没有匹配与无权限需要不同下一步；不能把所有空缺都写成“暂无数据”。 三种空缺，三种下一步 输入替代与减少动态 Keyboard access 引导不依赖自动移动指针或闪烁；关闭动画后，操作顺序和目标仍能理解。 Tab Enter 不依赖自动移动与闪烁</p></div><div class=\"sec\"><h4>边界</h4><p>确认实现范围，检查异常、恢复和可访问性。 三步提示围绕真实输入、生成预览和发布本地结果推进；可跳过且工具始终可用。提示不会占据全局焦点，不记录账号级完成进度，也不遮挡其他页面功能。</p></div><div class=\"sec\"><h4>完成后检查</h4><p>引导不锁死正常操作。 提示针对当前步骤。 空状态区分未创建、无匹配与无权限。 本篇帮助用户发现和完成操作；通知反馈事件，校验指出当前输入错误。 漫游式引导 空状态 文字提示</p></div>"}, {"cn": "权限请求", "en": "Permission Requests", "cat": "操作流程", "desc": "用户发起功能，说明用途，允许或使用替代。", "href": "https://www.vibehub.xin/item/ix_permissions", "color": "#0c8599", "content": "<div class=\"sec\"><h4>概述</h4><p>了解适用场景，比较相近方案并明确选择条件。 权限与</p></div><div class=\"sec\"><h4>用途</h4><p>Permission rationale 在用户主动使用相机、麦克风或位置等功能时解释用途，再触发授权；不要进入页面就连续请求。 开始录音 用于转写 先说明用途，再触发授权 权限状态 Prompt 待请求、已允许和被拒绝需要不同入口；权限状态由真实浏览器或系统结果确认。 待请求 待请求 → 已允许 / 被拒绝</p></div><div class=\"sec\"><h4>流程</h4><p>沿操作顺序查看响应、分支和结果之间的关系。 拒绝与替代 Denied 拒绝后保留原任务，提供文字、文件选择或手动输入等可用路径，不用反复弹窗施压。 改用上传或手动输入 撤回与中途变化 Revoked permission 权限可能在运行中被撤回；停止相关资源并说明当前状态，不能继续显示正在录音或定位成功。 REC 已停止 停止音轨，同步当前状态 查询与请求 Permissions query 查询已有状态和请求授权是不同动作，各浏览器能力有差异；查询不支持时仍提供可理解流程。 已授权 请求 查询已有状态 ≠ 请求授权 浏览器与业务权限 Browser permission 浏览器允许使用麦克风不代表用户具有业务管理权限；演示流程不伪装系统原生授权框。 麦克风 浏览器允许 ≠ 业务权限</p></div><div class=\"sec\"><h4>边界</h4><p>确认实现范围，检查异常、恢复和可访问性。 允许、拒绝和撤回只改变演练内的权限模型，绝不伪造浏览器系统授权框。查询按钮只读取浏览器已有麦克风权限；实际主动录音与释放音轨在「媒体与语音」演练。</p></div><div class=\"sec\"><h4>完成后检查</h4><p>由真实用户操作触发授权。 不能伪装浏览器授权框。 不把登录或业务角色当浏览器权限。 本篇讲设备能力授权与替代方案；身份验证决定用户是谁，服务端鉴权决定能否访问业务数据。 身份验证 媒体操作 内容分享</p></div>"}, {"cn": "离线同步", "en": "Offline Sync", "cat": "操作流程", "desc": "离线修改，恢复并核对版本，同步或解决冲突。", "href": "https://www.vibehub.xin/item/ix_offline_sync", "color": "#0c8599", "content": "<div class=\"sec\"><h4>概述</h4><p>了解适用场景，比较相近方案并明确选择条件。 本地与远端 Local state 已写入本地、正在同步和已被服务端确认是不同状态，应让用户明确当前数据保存到了哪里。 本地已写 · 同步中 · 远端已确认 离线队列 Offline queue 离线时保留待提交修改，恢复连接后按顺序核对；排队写入还需要真实持久化策略。 3 待同步 恢复连接后按顺序核对</p></div><div class=\"sec\"><h4>流程</h4><p>沿操作顺序查看响应、分支和结果之间的关系。 重新连接 Reconnect 恢复连接后先核对远端状态与版本，再发送可能冲突的修改，不能把网络恢复直接当作同步完成。 v3 v4 先核对版本，再发送修改 版本冲突 Revision conflict 本地修改基于旧版本时，保留本地草稿和远端内容，让用户比较、合并或选择保留哪一方。 v3 v4 保留两份，选择后才对齐 重试与去重 Retry queue 每个待提交操作有稳定身份，失败重试不能重复执行已经成功的修改；具体保证由服务端配合。 op#1 op#2 稳定操作身份，重试不重复执行 退出前保护 Unsynced changes 还有未同步修改时说明风险和恢复方式；当前演示只在内存运行，刷新不会恢复队列。 留下 退出 说明风险与恢复方式</p></div><div class=\"sec\"><h4>边界</h4><p>确认实现范围，检查异常、恢复和可访问性。 离线开关、远端版本与队列均为本地模型，多次编辑合并为最新快照；不改变真实网络，也没有持久化队列。冲突保留两份内容，明确选择后才对齐版本；刷新会清空演练。</p></div><div class=\"sec\"><h4>完成后检查</h4><p>区分已存本地与已同步。 不丢未同步修改。 持久化和跨端能力需真实实现。 本篇讲跨连接状态的数据收敛；编辑与保存讲本地草稿，实时协作讲同一对象的并发修改。 内容编辑 任务处理 实时协作</p></div>"}, {"cn": "实时协作", "en": "Real-time Collaboration", "cat": "操作流程", "desc": "建立各自草稿，另一角色提交，比较并处理冲突。", "href": "https://www.vibehub.xin/item/ix_collaboration", "color": "#0c8599", "content": "<div class=\"sec\"><h4>概述</h4><p>了解适用场景，比较相近方案并明确选择条件。 在线与正在编辑 Presence 在线、正在查看和正在编辑是不同状态；存在标记帮助协调，不代表数据已经同步。 A B 在场标记不代表数据已同步 并发草稿 Concurrent draft 多人同时编辑时，各自保留草稿和基准版本；新远端内容不应静默覆盖本地未保存修改。 草稿 A 草稿 B 合并保留双方未保存内容</p></div><div class=\"sec\"><h4>流程</h4><p>沿操作顺序查看响应、分支和结果之间的关系。 锁定与协调 Edit lock 需要互斥编辑时说明谁正在占用、如何释放与过期；仅显示锁图标不能代替服务端协调。 编辑中 占用与过期需服务端协调 冲突与合并 Conflict 提交基准落后时先展示差异，选择覆盖、接收或合并；不可把对方修改悄悄丢弃。 本地 远端 差异可见，不静默覆盖 评论与上下文 Comment 评论和提醒关联具体对象或版本；对象被移除后保留可理解的来源与处理入口。 3 评论绑定对象与版本 重连与真实</p></div><div class=\"sec\"><h4>边界</h4><p>Reconnect 真实多人需要共享传输、身份与服务端一致性；本页双角色属于同一浏览器内的本地模拟。 A B 同浏览器模拟，非共享传输</p></div><div class=\"sec\"><h4>边界</h4><p>确认实现范围，检查异常、恢复和可访问性。 两个角色、在线状态、共享版本、锁和评论均在同一页面模拟，不连接其他用户。干净草稿可跟随提交更新，脏草稿保留；过期提交必须显式接收、覆盖或合并，不实现 CRDT／OT。</p></div><div class=\"sec\"><h4>完成后检查</h4><p>不把本地双角色模拟称为真实多人。 实时传输与重连状态明确。 共享状态不抢焦点。 本篇讲并发编辑的对象归属与冲突；离线同步处理连接中断后的收敛，消息通知传达协作事件。 评论 离线同步 内容编辑</p></div>"}, {"cn": "媒体操作", "en": "Media Controls", "cat": "操作流程", "desc": "准备本地媒体，播放或录制，定位、暂停或释放资源。", "href": "https://www.vibehub.xin/item/ix_media", "color": "#0c8599", "content": "<div class=\"sec\"><h4>概述</h4><p>了解适用场景，比较相近方案并明确选择条件。 播放与缓冲 Playback 暂停由用户控制，缓冲表示数据暂未就绪；界面应区分两者，不能用同一种静止画面暗示原因。 暂停 ≠ 缓冲 进度与定位 Seek 时间轴对应真实媒体位置，定位后更新当前时间；未知时长或尚未就绪时限制无意义的拖动。 0:03 0:08 时间轴对应真实位置</p></div><div class=\"sec\"><h4>流程</h4><p>沿操作顺序查看响应、分支和结果之间的关系。 音量、倍速与字幕 Volume 用户能控制音量、速度和文字辅助；静音不等于暂停，字幕与转写也不是同一种内容。 1.5× CC 音量 · 速度 · 字幕分别控制 全屏与画中画 Fullscreen 能力取决于媒体类型和浏览器，按用户操作请求；不支持时保持原来的可用播放入口。 按用户操作请求能力 录音生命周期 MediaRecorder 只有用户主动启动后才请求麦克风；停止、失败和退出时释放音轨，录制结果明确保存在本地。 停止与退出都释放音轨 转写与修正 Transcript 语音转写可能有误，允许人工修正；本地文本编辑不应被描述为已经接入在线识别服务。 转写文本 修正 允许人工修正识别结果</p></div><div class=\"sec\"><h4>边界</h4><p>确认实现范围，检查异常、恢复和可访问性。 播放器使用本地生成的 8 秒 WAV 音频；录音仅在主动点击后申请麦克风，不上传，停止与退出均释放音轨。录音格式由浏览器决定；转写文本为可编辑样例，不进行语音识别。</p></div><div class=\"sec\"><h4>完成后检查</h4><p>缓冲和暂停区分。 自动播放失败有手动入口。 麦克风和播放资源及时释放。 本篇管理媒体时间轴与采集资源；权限请求讲授权和拒绝替代，对话与生成讲分段输出。 进度条 滑块 权限请求</p></div>"}, {"cn": "AI 对话", "en": "AI Conversation", "cat": "操作流程", "desc": "发送问题，接收部分回答，停止、分支或应用结果。", "href": "https://www.vibehub.xin/item/ix_conversation", "color": "#0c8599", "content": "<div class=\"sec\"><h4>概述</h4><p>了解适用场景，比较相近方案并明确选择条件。 发送与任务 Send 发送后区分消息已提交和回答仍在生成；用户输入与模型或服务结果分别记录。 已发送 已提交 ≠ 回答生成完毕 流式输出 Streaming 逐段内容是当前任务的一部分，完成、失败与中断有独立状态；本地示例不冒充真实模型调用。 streaming 逐段输出，完成才结束</p></div><div class=\"sec\"><h4>流程</h4><p>沿操作顺序查看响应、分支和结果之间的关系。 停止与失效 Stop generation 停止后使旧输出失效，后到片段不能继续写入；保留已经收到的内容并说明结果未完成。 已停止 保留已收到内容，结果未完成 重新生成与分支 Regenerate 编辑旧消息或重新生成会改变后续上下文，应保留可识别的分支关系，而非无声覆盖整段历史。 v2 编辑旧消息 → 保留新分支 跟随与阅读 Follow output 用户停留底部时可以跟随输出；上翻阅读后停止强制滚动，用明确入口查看新内容。 新内容 上翻后停止强制滚动 引用与应用 Citation 引用应能定位来源，应用结果前说明目标与替换范围；演示只修改右侧本地文档，不写入真实项目。 引用 2 引用定位来源，应用说明范围</p></div><div class=\"sec\"><h4>边界</h4><p>确认实现范围，检查异常、恢复和可访问性。 回答为三个固定本地片段，需手动接收，不调用 AI 服务。停止会使旧片段失效，编辑旧消息创建保留的新分支；应用前确认本地目标。没有真实模型推理、工具执行、附件解析或联网搜索。</p></div><div class=\"sec\"><h4>完成后检查</h4><p>停止后旧片段不继续写入。 上翻阅读时不被拉回底部。 输出应用前说明目标和范围。 本篇组织对话、输出分支和应用目标；异步任务提供取消与旧回传防护，编辑与保存管理应用后的草稿。 任务处理 滚动控制 内容编辑</p></div>"}];
const grid=document.getElementById('grid'),empty=document.getElementById('empty');
let curCat='all',kw='';
function render(){
  grid.innerHTML='';let n=0;
  CARDS.forEach(c=>{
    if(curCat!=='all'&&c.cat!==curCat)return;
    if(kw&&!(c.cn+c.en+c.desc+c.content).toLowerCase().includes(kw))return;
    n++;
    const el=document.createElement('div');el.className='card';
    el.innerHTML=`
      <div class="card-top" onclick="this.parentElement.classList.toggle('open')">
        <div class="card-head">
          <div><span class="tag" style="background:${c.color}">${c.cat}</span>
          <h3>${c.cn}</h3><div class="en">${c.en}</div>
          <p class="desc">${c.desc}</p></div>
          <span class="toggle">▾</span>
        </div>
      </div>
      <div class="card-body">${c.content}</div>
      <div class="card-foot"><a href="${c.href}" target="_blank" rel="noopener">查看原站详情 →</a></div>`;
    grid.appendChild(el);
  });
  empty.style.display=n?'none':'block';
}
document.getElementById('nav').addEventListener('click',e=>{
  const b=e.target.closest('.nav-btn');if(!b)return;
  document.querySelectorAll('.nav-btn').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');curCat=b.dataset.cat;render();
});
document.getElementById('search').addEventListener('input',e=>{
